<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repère">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Repère-marqueur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: phone app. Fixed title bar, three views, tab bar at the bottom. */
:root{
  --paper:#f4f2ee; --card:#ffffff; --ink:#1c2230; --muted:#667085; --line:#dcd8d0;
  --accent:#1f5c7a; --accent-ink:#ffffff; --ring:#e5141b; --warn:#9a5b00;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --tab-h:62px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#14171d; --card:#1e232c; --ink:#eceef2; --muted:#9aa3b2; --line:#333a47;
    --accent:#6fb7d8; --accent-ink:#0d1a22; --ring:#ff3b41; --warn:#f0b455;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.topbar h1{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin:0}
.topbar small{font:500 13px var(--mono);color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}
.view{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{display:flex;gap:8px}
.search input,.ask textarea{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.search input{font:500 20px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.search input::placeholder{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:16px;color:var(--muted)}
.ask{display:flex;flex-direction:column;gap:8px}
.ask textarea{font:400 16px var(--body);resize:none;min-height:76px}
button,.filebtn{font:700 15px var(--body);border-radius:12px;border:2px solid var(--accent);padding:12px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:46px}
button.ghost,.filebtn{background:transparent;color:var(--accent)}
.filebtn{display:inline-flex;align-items:center}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,.filebtn:focus-within,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.status{font-size:14px;color:var(--muted);min-height:20px}
.status.warn{color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 14px var(--mono);padding:8px 12px;min-height:0;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chip.word{font-family:var(--body)}
.chip[aria-pressed="true"]{border-color:var(--ring);color:var(--ring);border-width:2px}
.found{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.found b{font:500 26px var(--mono);color:var(--ring)}
.found span{color:var(--muted)}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex:none;display:inline-block}
#zoom{width:100%;aspect-ratio:1/1;border-radius:12px;display:block;background:var(--line)}
.stage{position:relative;border-radius:12px;overflow:hidden;line-height:0;background:var(--line)}
.stage img{width:100%;height:auto;display:block;max-width:100%}
.ring{position:absolute;width:6.4%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:3px solid var(--ring);border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 2px #fff inset;pointer-events:none}
.ring i{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);font:700 11px/1 var(--body);font-style:normal;background:var(--ring);color:#fff;border-radius:999px;padding:3px 6px}
.ring.sel{animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 2px #fff,0 0 0 2px #fff inset,0 0 0 0 rgba(229,20,27,.7)}100%{box-shadow:0 0 0 2px #fff,0 0 0 2px #fff inset,0 0 0 22px rgba(229,20,27,0)}}
/* assistant chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:11px 14px;border-radius:18px;display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.bot.wide{max-width:100%;width:100%}
.msg.warn{color:var(--warn)}
.msg.wait p{color:var(--muted)}
.fade{height:30px;border-radius:10px;border:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer}
.steps .dot{width:30px;height:30px}
.steps b{font:500 16px var(--mono)}
.steps .txt{display:flex;flex-direction:column;min-width:0}
.steps .txt span{font-size:13px;color:var(--muted)}
.composer{position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;align-items:flex-end;
  background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 16px var(--body);resize:none;padding:10px 0;max-height:120px;outline:none}
.composer button{width:46px;height:46px;min-height:0;padding:0;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.composer svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* inventory */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.grid button{min-height:0;padding:8px 4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 13px var(--mono);display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:10px}
.grid .dot{width:26px;height:26px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:220px;height:var(--tab-h);min-height:0;border:0;border-radius:0;background:transparent;color:var(--muted);
  font:700 12px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.ring.sel{animation:none}.bar i{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topbar">
  <h1>Repère-marqueur</h1>
  <small id="count"></small>
</header>

<main>
  <!-- ============ Trouver ============ -->
  <div class="view" id="view-trouver">
    <section class="card" aria-label="Recherche">
      <form class="search" id="form">
        <input id="q" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code ou nom : BV312, Cerulean…" aria-label="Code ou nom de la couleur">
        <button id="go" type="submit">Trouver</button>
      </form>
      <div class="status" id="status" role="status"></div>
      <div class="bar" id="bar" hidden><i id="barfill"></i></div>
      <div class="chips" id="chips" hidden></div>
      <button id="deep" type="button" class="ghost" hidden>Chercher directement sur la photo</button>
    </section>

    <section class="card" id="hitcard" hidden aria-label="Résultat">
      <div class="found"><span class="dot" id="hitdot"></span><b id="hitcode"></b><span id="hitname"></span></div>
      <canvas id="zoom" width="720" height="720"></canvas>
      <button id="blend" type="button" class="ghost">Quoi utiliser avec cette couleur ?</button>
    </section>

    <section class="card" aria-label="Photo complète">
      <h2>Toute la trousse</h2>
      <div class="stage" id="stage"><img id="photo" src="trousse.jpg" alt="Photo de la trousse de marqueurs vue du dessus"></div>
    </section>
  </div>

  <!-- ============ Assistant ============ -->
  <div class="view" id="view-idees" hidden>
    <div class="chat" id="chat" aria-live="polite">
      <div class="msg bot"><p>Dis-moi ce que tu veux dessiner ou quelle couleur tu veux fondre. Je choisis dans ta trousse et j'encercle en rouge les marqueurs à sortir.</p></div>
    </div>
    <div class="chips" id="ideas">
      <button type="button" class="chip word">Un nuage avec des ombres douces</button>
      <button type="button" class="chip word">Un coucher de soleil</button>
      <button type="button" class="chip word">Un fade à partir de BV312</button>
      <button type="button" class="chip word">Un teint de peau</button>
    </div>
    <form class="composer" id="askform">
      <textarea id="ask" rows="1" maxlength="600" placeholder="Ex. fade avec B02" aria-label="Ton message"></textarea>
      <button id="askgo" type="submit" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>

  <!-- ============ Trousse ============ -->
  <div class="view" id="view-trousse" hidden>
    <section class="card" aria-label="Photo de la trousse">
      <h2>Ma photo</h2>
      <p class="status" id="scanstatus" role="status"></p>
      <div class="bar" id="bar2" hidden><i id="barfill2"></i></div>
      <div class="row">
        <button id="scan" type="button">Analyser la photo</button>
        <label class="filebtn">Changer de photo<input id="file" type="file" accept="image/*"></label>
      </div>
    </section>
    <section class="card" id="invcard" hidden aria-label="Mes couleurs">
      <h2>Mes couleurs</h2>
      <div class="grid" id="inv"></div>
    </section>
  </div>
</main>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-view="trouver" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>Trouver
  </button>
  <button role="tab" data-view="idees" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Assistant
  </button>
  <button role="tab" data-view="trousse" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M8 6V4h8v2M3 12h18"/></svg>Trousse
  </button>
</nav>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var photo = { img: $("photo"), key: "defaut", ready: false };
  var index = [];      // {code, name, x, y, hex} — x,y in 0..1 of the whole photo
  var hits = [], sel = 0, busy = false, lastQuery = "", numbered = false;

  function say(msg, warn){
    ["status", "scanstatus"].forEach(function(id){ var s = $(id); s.textContent = msg || ""; s.className = "status" + (warn ? " warn" : ""); });
  }
  function progress(done, total){
    [["bar", "barfill"], ["bar2", "barfill2"]].forEach(function(p){
      $(p[0]).hidden = total === 0;
      $(p[1]).style.width = total ? Math.round(done / total * 100) + "%" : "0";
    });
  }
  function go(view){
    ["trouver", "idees", "trousse"].forEach(function(v){ $("view-" + v).hidden = v !== view; });
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-view") === view ? "true" : "false");
    });
    window.scrollTo(0, 0);
    if (view === "trouver") draw();
  }

  /* ---- code normalisation: BV 312 = bv312, letter O next to digits = zero ---- */
  function canon(s){
    s = String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    s = s.replace(/O(?=\d)/g, "0");
    s = s.replace(/(\d)O/g, function(m, d){ return d + "0"; });
    return s;
  }
  function lev(a, b){
    var m = a.length, n = b.length, i, j, prev, cur;
    if (Math.abs(m - n) > 1) return 9;
    prev = []; for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++){
      cur = [i];
      for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function byCode(code){ var c = canon(code); for (var i = 0; i < index.length; i++) if (index[i].code === c) return index[i]; return null; }

  /* ---- cache of the scan, per photo, in this browser only ---- */
  function loadCache(){
    try { var raw = localStorage.getItem("repere:" + photo.key); index = raw ? JSON.parse(raw) : []; }
    catch (e) { index = []; }
  }
  function saveCache(){ try { localStorage.setItem("repere:" + photo.key, JSON.stringify(index)); } catch (e) {} }

  /* ---- colour of a cap, measured on the photo (label white and printed text are ignored) ---- */
  var probe = document.createElement("canvas"); probe.width = probe.height = 24;
  function capHex(item){
    try {
      var W = photo.img.naturalWidth, H = photo.img.naturalHeight, d = Math.max(W, H) * 0.03;
      var ctx = probe.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(photo.img, item.x * W - d / 2, item.y * H - d / 2, d, d, 0, 0, 24, 24);
      var px = ctx.getImageData(0, 0, 24, 24).data, r = 0, g = 0, b = 0, n = 0, R = 0, G = 0, B = 0, N = 0;
      for (var i = 0; i < px.length; i += 4){
        var l = (Math.max(px[i], px[i + 1], px[i + 2]) + Math.min(px[i], px[i + 1], px[i + 2])) / 510;
        R += px[i]; G += px[i + 1]; B += px[i + 2]; N++;
        if (l > 0.9 || l < 0.22) continue;
        r += px[i]; g += px[i + 1]; b += px[i + 2]; n++;
      }
      if (n < 40){ r = R; g = G; b = B; n = N; }
      var h = function(v){ var s = Math.round(v / n).toString(16); return s.length < 2 ? "0" + s : s; };
      return "#" + h(r) + h(g) + h(b);
    } catch (e) { return ""; }
  }
  function fillColours(){
    var changed = false;
    index.forEach(function(it){ if (!it.hex){ it.hex = capHex(it); changed = true; } });
    if (changed) saveCache();
  }

  /* ---- tiles: the photo is cut in overlapping pieces so labels are big enough to read ---- */
  function makeTiles(){
    var W = photo.img.naturalWidth, H = photo.img.naturalHeight;
    var cols = W >= H ? 4 : 3, rows = W >= H ? 3 : 4, ov = 0.18;
    var tw = W / (cols * (1 - ov) + ov), th = H / (rows * (1 - ov) + ov);
    var out = [], r, c;
    for (r = 0; r < rows; r++) for (c = 0; c < cols; c++)
      out.push({ x: c * tw * (1 - ov), y: r * th * (1 - ov), w: tw, h: th });
    return out;
  }
  function tileBlob(t){
    return new Promise(function(resolve, reject){
      var k = Math.min(1, 1100 / Math.max(t.w, t.h));
      var cv = document.createElement("canvas");
      cv.width = Math.round(t.w * k); cv.height = Math.round(t.h * k);
      cv.getContext("2d").drawImage(photo.img, t.x, t.y, t.w, t.h, 0, 0, cv.width, cv.height);
      cv.toBlob(function(b){ b ? resolve(b) : reject(new Error("image")); }, "image/jpeg", 0.88);
    });
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function toBase64(blob){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(String(r.result).split(",")[1]); };
      r.onerror = reject; r.readAsDataURL(blob);
    });
  }
  async function call(payload){
    var body = JSON.stringify(payload);
    for (var attempt = 0; attempt < 2; attempt++){
      var res = await fetch("/api/claude", { method: "POST", headers: { "Content-Type": "application/json" }, body: body });
      if (res.status === 429 && attempt === 0){ await wait(6000); continue; }
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok){ var err = new Error(data.error || "http " + res.status); err.code = res.status === 429 ? "rate_limited" : (data.code || "server"); throw err; }
      return data.text || "";
    }
    return "";
  }
  async function ask(job, blob){ return call({ mode: job.mode, code: job.code || "", image: await toBase64(blob) }); }
  function parseJson(text, open, close){
    var a = text.indexOf(open), b = text.lastIndexOf(close);
    if (a < 0) return null;
    var body = b > a ? text.slice(a, b + 1) : text.slice(a);
    try { return JSON.parse(body); } catch (e) {}
    if (open === "["){               // answer cut short: keep the complete items
      var cut = body.lastIndexOf("}");
      if (cut > 0){ try { return JSON.parse(body.slice(0, cut + 1) + "]"); } catch (e2) {} }
    }
    return null;
  }
  async function pool(items, n, fn){
    var i = 0;
    async function run(){ while (i < items.length){ var k = i++; await fn(items[k], k); } }
    var runs = []; for (var j = 0; j < n; j++) runs.push(run());
    await Promise.all(runs);
  }
  function explain(e){
    if (e && e.code === "no_key") return "Clé API manquante ou refusée. Vérifie ANTHROPIC_API_KEY dans les variables d'environnement Vercel, puis redéploie.";
    if (e && e.code === "rate_limited") return "Trop de demandes d'un coup. Attends une minute et relance.";
    return "La demande a échoué" + (e && e.message ? " (" + String(e.message).slice(0, 120) + ")" : "") + ". Relance dans un instant.";
  }

  async function scan(){
    if (busy || !ready()) return;
    busy = true; lock(true);
    var tiles = makeTiles(), done = 0, best = {}, failed = 0, stop = null;
    say("Lecture des étiquettes : 0 / " + tiles.length + " zones");
    progress(0, tiles.length);
    var W = photo.img.naturalWidth, H = photo.img.naturalHeight;
    await pool(tiles, 3, async function(t){
      if (stop) return;
      try {
        var arr = parseJson(await ask({ mode: "list" }, await tileBlob(t)), "[", "]");
        if (!Array.isArray(arr)) { failed++; }
        else arr.forEach(function(it){
          var code = canon(it && it.code), x = Number(it && it.x), y = Number(it && it.y);
          if (!code || !(x >= 0 && x <= 1000 && y >= 0 && y <= 1000)) return;
          var edge = Math.min(x, 1000 - x, y, 1000 - y);
          if (best[code] && best[code].edge >= edge) return;
          best[code] = { code: code, name: String(it.name || "").slice(0, 40), edge: edge,
            x: (t.x + x / 1000 * t.w) / W, y: (t.y + y / 1000 * t.h) / H };
        });
      } catch (e) {
        if (e && (e.code === "no_key" || e.code === "rate_limited")) stop = e; else failed++;
      }
      done++;
      say("Lecture des étiquettes : " + done + " / " + tiles.length + " zones");
      progress(done, tiles.length);
    });
    progress(0, 0); busy = false; lock(false);
    var list = Object.keys(best).map(function(k){ var b = best[k]; return { code: b.code, name: b.name, x: b.x, y: b.y }; });
    if (stop && !list.length){ say(explain(stop), true); return; }
    if (!list.length){ say("Aucun code lisible. Reprends la photo de plus près, bien éclairée.", true); return; }
    index = list; fillColours(); saveCache(); refresh();
    say(list.length + " codes repérés" + (failed || stop ? " (certaines zones n'ont pas pu être lues)." : "."), !!(failed || stop));
    if (lastQuery) search(lastQuery);
  }

  /* ---- fallback: look for one code on every tile ---- */
  async function deepSearch(){
    var code = canon(lastQuery);
    if (busy || !ready() || !code) return;
    busy = true; lock(true);
    var tiles = makeTiles(), done = 0, found = null, stop = null;
    var W = photo.img.naturalWidth, H = photo.img.naturalHeight;
    say("Recherche de " + code + " zone par zone…"); progress(0, tiles.length);
    await pool(tiles, 3, async function(t){
      if (stop) return;
      try {
        var o = parseJson(await ask({ mode: "find", code: code }, await tileBlob(t)), "{", "}");
        if (o && o.found === true && o.x >= 0 && o.x <= 1000 && o.y >= 0 && o.y <= 1000){
          var edge = Math.min(o.x, 1000 - o.x, o.y, 1000 - o.y);
          if (!found || edge > found.edge)
            found = { code: code, edge: edge, x: (t.x + o.x / 1000 * t.w) / W, y: (t.y + o.y / 1000 * t.h) / H };
        }
      } catch (e) {
        if (e && (e.code === "no_key" || e.code === "rate_limited")) stop = e;
      }
      done++; progress(done, tiles.length);
    });
    progress(0, 0); busy = false; lock(false);
    if (found){
      index = index.filter(function(i){ return i.code !== code; });
      index.push({ code: found.code, name: "", x: found.x, y: found.y }); fillColours(); saveCache(); refresh();
      search(code);
    } else say(stop ? explain(stop) : code + " n'apparaît pas sur cette photo. Vérifie le code ou reprends la photo.", true);
  }

  /* ---- search in the scan ---- */
  function search(raw){
    lastQuery = raw; numbered = false;
    var q = canon(raw), name = String(raw || "").trim().toLowerCase();
    $("deep").hidden = true; $("chips").hidden = true; $("chips").innerHTML = "";
    if (!q){ hits = []; draw(); say(""); return; }
    if (!index.length){ hits = []; draw(); say("Analyse d'abord la photo dans l'onglet Trousse.", true); return; }
    hits = index.filter(function(i){ return i.code === q; });
    if (!hits.length && name.length >= 3)
      hits = index.filter(function(i){ return i.name.toLowerCase().indexOf(name) >= 0; }).slice(0, 12);
    sel = 0;
    if (hits.length){
      say(hits.length > 1 ? hits.length + " marqueurs correspondent. Touche un code pour le voir." : "Trouvé.");
      if (hits.length > 1) chipList(hits.map(function(h){ return h.code; }), true);
    } else {
      var near = index.filter(function(i){ return lev(i.code, q) <= 1; }).slice(0, 8);
      say(q + " n'est pas dans les codes lus." + (near.length ? " Codes proches :" : ""), true);
      if (near.length) chipList(near.map(function(h){ return h.code; }), false);
      $("deep").hidden = false;
    }
    draw();
  }
  function chipList(codes, isHits){
    var box = $("chips"); box.hidden = false; box.innerHTML = "";
    codes.forEach(function(c, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = (numbered ? (i + 1) + " · " : "") + c;
      if (isHits) b.setAttribute("aria-pressed", i === sel ? "true" : "false");
      b.addEventListener("click", function(){
        if (isHits){ sel = i; Array.prototype.forEach.call(box.children, function(el, k){ el.setAttribute("aria-pressed", k === i ? "true" : "false"); }); draw(); }
        else { $("q").value = c; search(c); }
      });
      box.appendChild(b);
    });
  }

  /* ---- drawing: red rings on the whole photo, close-up of the selected hit ---- */
  function draw(){
    var stage = $("stage");
    Array.prototype.slice.call(stage.querySelectorAll(".ring")).forEach(function(el){ el.remove(); });
    hits.forEach(function(h, i){
      var r = document.createElement("div");
      r.className = "ring" + (i === sel ? " sel" : "");
      r.style.left = (h.x * 100) + "%"; r.style.top = (h.y * 100) + "%";
      if (numbered){ var n = document.createElement("i"); n.textContent = i + 1; r.appendChild(n); }
      stage.appendChild(r);
    });
    var h = hits[sel];
    $("hitcard").hidden = !h;
    if (!h || !photo.ready) return;
    $("hitcode").textContent = h.code; $("hitname").textContent = h.name || "";
    $("hitdot").style.background = h.hex || "transparent";
    var W = photo.img.naturalWidth, H = photo.img.naturalHeight;
    var side = Math.min(W, H, Math.max(W, H) * 0.26);
    var sx = Math.max(0, Math.min(W - side, h.x * W - side / 2));
    var sy = Math.max(0, Math.min(H - side, h.y * H - side / 2));
    var cv = $("zoom"), ctx = cv.getContext("2d"), k = cv.width / side;
    ctx.drawImage(photo.img, sx, sy, side, side, 0, 0, cv.width, cv.height);
    var cx = (h.x * W - sx) * k, cy = (h.y * H - sy) * k, rad = Math.max(W, H) * 0.031 * k;
    ctx.lineWidth = 12; ctx.strokeStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 7; ctx.strokeStyle = "#e5141b";
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
  }

  /* ---- Assistant: a conversation; Claude picks colours among the markers of the case ---- */
  var chat = [];   // {role, content} sent back to the server as history
  function bubble(cls, text){
    var m = document.createElement("div"); m.className = "msg " + cls;
    if (text){ var p = document.createElement("p"); p.textContent = text; m.appendChild(p); }
    $("chat").appendChild(m);
    return m;
  }
  function toBottom(){ window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" }); }
  async function sendChat(text){
    text = String(text || "").trim();
    if (busy || !text) return;
    $("ask").value = ""; $("ask").style.height = ""; $("ideas").hidden = true;
    bubble("me", text);
    if (!index.length){
      bubble("bot warn", "Je dois d'abord connaître tes couleurs : va dans l'onglet Trousse et appuie sur Analyser la photo.");
      toBottom(); return;
    }
    busy = true; $("askgo").disabled = true;
    chat.push({ role: "user", content: text });
    var waitMsg = bubble("bot wait", "Je regarde dans ta trousse…"); toBottom();
    try {
      var raw = await call({ mode: "chat", messages: chat.slice(-12),
        palette: index.map(function(i){ return { code: i.code, name: i.name, hex: i.hex || "" }; }) });
      var o = parseJson(raw, "{", "}") || { reponse: raw };
      var picks = (Array.isArray(o.marqueurs) ? o.marqueurs : []).map(function(m){
        var it = byCode(m && m.code);
        return it ? { item: it, role: String(m.role || "").slice(0, 40) } : null;
      }).filter(Boolean);
      var reply = String(o.reponse || "").slice(0, 1200) || "Voici ce que je te propose.";
      waitMsg.remove();
      renderReply(reply, picks);
      chat.push({ role: "assistant", content: reply + (picks.length ? "\nMarqueurs proposés : " + picks.map(function(p){ return p.item.code; }).join(", ") : "") });
    } catch (e) {
      chat.pop(); waitMsg.remove();
      bubble("bot warn", explain(e));
    }
    busy = false; $("askgo").disabled = false; toBottom();
  }
  function renderReply(reply, picks){
    var m = bubble("bot" + (picks.length ? " wide" : ""), reply);
    if (!picks.length) return;
    var items = picks.map(function(p){ return p.item; });
    var cols = items.map(function(i){ return i.hex || "#888888"; });
    var fade = document.createElement("div"); fade.className = "fade";
    fade.style.background = cols.length > 1 ? "linear-gradient(90deg," + cols.join(",") + ")" : cols[0];
    m.appendChild(fade);
    var ol = document.createElement("ol"); ol.className = "steps";
    picks.forEach(function(p, i){
      var li = document.createElement("li");
      var dot = document.createElement("span"); dot.className = "dot"; dot.style.background = p.item.hex || "transparent";
      var txt = document.createElement("div"); txt.className = "txt";
      var b = document.createElement("b"); b.textContent = (i + 1) + " · " + p.item.code;
      var sp = document.createElement("span"); sp.textContent = [p.item.name, p.role].filter(Boolean).join(" · ");
      txt.appendChild(b); txt.appendChild(sp); li.appendChild(dot); li.appendChild(txt);
      li.addEventListener("click", function(){ showOnPhoto(items, i); });
      ol.appendChild(li);
    });
    m.appendChild(ol);
    // the whole case with every proposed marker circled in red
    var st = document.createElement("div"); st.className = "stage";
    var im = document.createElement("img"); im.src = photo.img.src; im.alt = "Marqueurs proposés encerclés sur la photo de la trousse";
    st.appendChild(im);
    items.forEach(function(h, i){
      var r = document.createElement("div"); r.className = "ring";
      r.style.left = (h.x * 100) + "%"; r.style.top = (h.y * 100) + "%";
      var n = document.createElement("i"); n.textContent = i + 1; r.appendChild(n);
      st.appendChild(r);
    });
    st.addEventListener("click", function(){ showOnPhoto(items, 0); });
    m.appendChild(st);
    var big = document.createElement("button"); big.type = "button"; big.className = "ghost"; big.textContent = "Voir de près, un par un";
    big.addEventListener("click", function(){ showOnPhoto(items, 0); });
    m.appendChild(big);
  }
  function showOnPhoto(items, i){
    hits = items.slice(); sel = i || 0; numbered = true; lastQuery = "";
    $("q").value = ""; $("deep").hidden = true;
    chipList(hits.map(function(h){ return h.code; }), true);
    say(hits.length + " couleurs proposées. Touche un code pour le voir de près.");
    go("trouver");
  }

  /* ---- Trousse: inventory ---- */
  function refresh(){
    $("scan").textContent = index.length ? "Réanalyser la photo" : "Analyser la photo";
    $("scan").className = index.length ? "ghost" : "";
    $("count").textContent = index.length ? index.length + " couleurs" : "";
    var box = $("inv"); box.innerHTML = ""; $("invcard").hidden = !index.length;
    index.slice().sort(function(a, b){ return a.code < b.code ? -1 : 1; }).forEach(function(it){
      var b = document.createElement("button"); b.type = "button"; b.title = it.name;
      var d = document.createElement("span"); d.className = "dot"; d.style.background = it.hex || "transparent";
      b.appendChild(d); b.appendChild(document.createTextNode(it.code));
      b.addEventListener("click", function(){ $("q").value = it.code; search(it.code); go("trouver"); });
      box.appendChild(b);
    });
  }
  function ready(){
    if (!photo.ready){ say("La photo n'est pas encore chargée.", true); return false; }
    return true;
  }
  function lock(on){ $("scan").disabled = on; $("deep").disabled = on; $("file").disabled = on; $("askgo").disabled = on; }
  function photoLoaded(){
    photo.ready = true; loadCache(); fillColours(); refresh(); hits = []; draw();
    say(index.length ? index.length + " codes repérés. Tape un code pour le trouver." : "Première étape : onglet Trousse, puis Analyser la photo (environ une minute, une seule fois par photo).");
  }

  /* ---- wiring ---- */
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-view")); });
  });
  $("form").addEventListener("submit", function(e){ e.preventDefault(); search($("q").value); $("q").blur(); });
  $("scan").addEventListener("click", scan);
  $("deep").addEventListener("click", deepSearch);
  $("askform").addEventListener("submit", function(e){ e.preventDefault(); sendChat($("ask").value); });
  $("ask").addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat($("ask").value); } });
  $("ask").addEventListener("input", function(){ this.style.height = "auto"; this.style.height = Math.min(120, this.scrollHeight) + "px"; });
  Array.prototype.forEach.call($("ideas").children, function(c){
    c.addEventListener("click", function(){ sendChat(c.textContent); });
  });
  $("blend").addEventListener("click", function(){
    var h = hits[sel]; if (!h) return;
    go("idees"); sendChat("Fais-moi un fade à partir de " + h.code + (h.name ? " (" + h.name + ")" : ""));
  });
  $("file").addEventListener("change", function(){
    var f = this.files && this.files[0]; if (!f) return;
    photo.ready = false; photo.key = f.name + ":" + f.size; lastQuery = ""; $("q").value = "";
    $("chips").hidden = true; $("deep").hidden = true; chat = [];
    photo.img.src = URL.createObjectURL(f);
  });
  photo.img.addEventListener("load", photoLoaded);
  photo.img.addEventListener("error", function(){ say("Cette image ne peut pas être ouverte. Choisis une photo JPEG ou PNG.", true); });
  if (photo.img.complete && photo.img.naturalWidth) photoLoaded();
})();
</script>
